version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - embeddings
    volumes:
      - ./backend/data:/app/backend/data

  embeddings:
    build:
      context: .
      dockerfile: embeddings-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
